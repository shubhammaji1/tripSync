name: Keep Render & Supabase Alive

on:
  schedule:
    # Runs every 12 minutes (Render spins down after 15 minutes of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TripSync Backend API (Wakes Render & Supabase)
        run: |
          # Replace URL with your actual deployed Render API URL or set secrets.RENDER_API_URL
          API_URL="${{ secrets.RENDER_API_URL || 'https://tripsync-api.onrender.com' }}"
          echo "Pinging ${API_URL}/api/v1/health ..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/api/v1/health" || echo "000")
          echo "Response HTTP Status: ${RESPONSE}"
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ TripSync Backend and Supabase DB successfully refreshed!"
          else
            echo "⚠️ Health check responded with code: ${RESPONSE}"
          fi
