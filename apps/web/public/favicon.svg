<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradient for Top Trail (Fades from transparent to Vibrant Green) -->
    <linearGradient id="fadeGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="1" />
    </linearGradient>
    
    <!-- Gradient for Bottom Trail (Fades from transparent to Teal/Cyan) -->
    <linearGradient id="fadeTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="1" />
    </linearGradient>

    <!-- Gradient for Central Map Pin (Dark Navy matching dashboard text) -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Central Static Radar Ring -->
  <g>
    <circle cx="50" cy="46" r="22" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.4" stroke-dasharray="3 3" />
    <circle cx="50" cy="46" r="14" fill="#10B981" opacity="0.15" />
  </g>

  <!-- Central Minimalist Map Pin -->
  <g filter="url(#shadow)">
    <!-- Base Shape -->
    <path d="M50 30 C41 30 34 37 34 46 C34 58 50 70 50 70 C50 70 66 58 66 46 C66 37 59 30 50 30 Z" fill="url(#pinGrad)"/>
    <!-- Inner Cutout -->
    <circle cx="50" cy="46" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Static Orbiting Paper Airplanes & Trails -->
  <g>
    <!-- Left Trail (Behind Green Plane) -->
    <path d="M 50 85 A 35 35 0 0 1 50 15" fill="none" stroke="url(#fadeGreen)" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
    
    <!-- Right Trail (Behind Teal Plane) -->
    <path d="M 50 15 A 35 35 0 0 1 50 85" fill="none" stroke="url(#fadeTeal)" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>

    <!-- Top Plane (Vibrant Green Route) -->
    <g transform="translate(50, 15)">
      <path d="M -10 -7 L 12 0 L -6 0 Z" fill="#34D399" />
      <path d="M -10 7 L 12 0 L -6 0 Z" fill="#10B981" />
    </g>

    <!-- Bottom Plane (Teal / Cyan Route) -->
    <g transform="translate(50, 85) rotate(180)">
      <path d="M -10 -7 L 12 0 L -6 0 Z" fill="#67E8F9" />
      <path d="M -10 7 L 12 0 L -6 0 Z" fill="#06B6D4" />
    </g>
  </g>
</svg>
